acts in generated audio, limited to one-second slices, and requires further development for longer or more complex audio.", "Model Architecture": "WaveGAN modifies the DCGAN architecture for audio, using 1D convolutions with longer filters and increased stride, and incorporating phase shuffle in the discriminator.", "Dependencies": "Uses WGAN-GP for training stability, relies on transposed convolution for upsampling, and incorporates phase shuffle to prevent discriminator overfitting.", "Synthesis": "The synthesis process uses transposed convolutions with 1D filters to convert low-dimensional latent vectors into high-dimensional audio waveforms.", "Dataset": "Speech Commands Zero Through Nine (SC09) dataset, along with other datasets like drum sound effects, bird vocalizations, piano, and large vocab speech (TIMIT).", "Preprocessing": "Audio is preprocessed into suitable formats, including short-time Fourier transform and normalization for spectrogram-based generation.", "Evaluation Metrics": "Inception score, nearest neighbor comparisons, and human evaluation metrics like accuracy, sound quality, ease of intelligibility, and speaker diversity.", "Performance": "WaveGAN produced diverse and intelligible speech digits, with promising results in other domains like drums and bird vocalizations.", "Contributions": "Introduced WaveGAN for unsupervised audio synthesis, demonstrated its effectiveness across various audio domains, and highlighted the challenges and potential solutions.", "Link": "https://arxiv.org/pdf/1802.04208v3", "Audio Samples": "", "Template": "", "Last Accessed": "2024-07-18", "Checked": "0.0"}, {"Name": "WaveGlow", "Authors": "Ryan Prenger, Rafael Valle, Bryan Catanzaro", "Description": "WaveGlow is a flow-based neural network designed to generate high-quality speech from mel-spectrograms efficiently and without auto-regression. It combines insights from Glow and WaveNet to achieve this goal.", "Training and Data": "WaveGlow is trained using a single network and a single loss function (likelihood maximization). It leverages invertible neural networks to ensure tractability in likelihood calculation, simplifying the training process.", "Application": "", "Advantages": "WaveGlow provides high-quality, efficient, and fast audio synthesis. It simplifies training and inference compared to auto-regressive models and achieves real-time or faster-than-real-time performance on modern GPUs.", " Limitations": "The model's performance and quality are evaluated primarily on a single-speaker dataset (LJ speech), and future work could explore its effectiveness across more diverse datasets and multi-speaker scenarios.", "Model Architecture": "The model is based on a series of invertible transformations, including invertible 1x1 convolutions and affine coupling layers. It conditions the audio generation on mel-spectrograms and uses a normalizing flow approach for tractable likelihood.", "Dependencies": "Implemented in PyTorch, utilizes NVIDIA GPUs for training and inference, with specific preprocessing parameters for mel-spectrogram generation.", "Synthesis": "WaveGlow generates speech by sampling from a zero-mean spherical Gaussian distribution and transforming these samples through a series of invertible layers conditioned on the input mel-spectrograms.", "Dataset": "Trained on the LJ speech dataset, consisting of 13,100 short audio clips (approximately 24 hours of speech) recorded in a home environment using a MacBook Pro's built-in microphone.", "Preprocessing": "Trained on the LJ speech dataset, consisting of 13,100 short audio clips (approximately 24 hours of speech) recorded in a home environment using a MacBook Pro's built-in microphone.", "Evaluation Metrics": "Mean Opinion Score (MOS) for perceptual quality comparison, and synthesis speed measured in kHz to assess efficiency and real-time capability.", "Performance": "Achieves synthesis speeds of over 500 kHz on an NVIDIA V100 GPU, significantly faster than real-time requirements. Delivers MOS scores close to real audio and better than Griffin-Lim and comparable to the best WaveNet implementations.", "Contributions": "Introduced a novel flow-based generative model for speech synthesis that combines ideas from Glow and WaveNet, achieving high-quality, efficient, and fast audio generation with a simpler training and inference process.", "Link": "https://arxiv.org/pdf/1811.00002", "Audio Samples": "", "Template": "", "Last Accessed": "2024-07-17", "Checked": "0.0"}, {"Name": "WaveNet", "Authors": "Aaron van den Oord, Sander Dieleman, Heiga Zen, Karen Simonyan, Oriol Vinyals, Alex Graves, Nal Kalchbrenner, Andrew Senior, Koray Kavukcuoglu", "Description": "WaveNet is a deep neural network for generating raw audio waveforms. The model is fully probabilistic and autoregressive, conditioning the predictive distribution of each audio sample on all previous ones. It achieves state-of-the-art performance in text-to-speech (TTS) and can also model music and other audio modalities.", "Training and Data": "Training involves transforming raw audio into quantized 8-bit \u00b5-law encoded values. The model is trained on datasets like VCTK (for multi-speaker speech) and proprietary datasets for TTS in English and Mandarin. The training utilizes a softmax distribution over possible audio sample values to model the conditional probabilities.", "Application": "", "Advantages": "WaveNet can generate highly natural-sounding speech, outperforming previous TTS systems. It can model various speakers with high fidelity and generate realistic musical fragments. The model's use of dilated convolutions allows it to capture long-range dependencies without the computational cost associated with recurrent networks.", " Limitations": "The model requires significant computational resources for training and inference. While WaveNet can generate high-quality audio, it can still face challenges in ensuring long-range coherence in generated music and maintaining consistent prosody in speech synthesis.", "Model Architecture": "The architecture includes stacks of dilated causal convolutional layers to increase the receptive field exponentially with depth. It uses gated activation units, residual and skip connections, and can be globally or locally conditioned on additional inputs (e.g., speaker identity, linguistic features).", "Dependencies": "Dependencies include TensorFlow or similar frameworks for training the convolutional neural networks, tools for audio preprocessing and \u00b5-law encoding, and computational resources for handling the intensive training and inference processes.", "Synthesis": "Uses dilated causal convolutions to model the conditional probabilities of audio samples, conditioned on previous samples and additional features like speaker identity and linguistic information. The model generates raw audio waveforms directly, allowing for high-fidelity audio synthesis across various tasks.", "Dataset": "Used datasets such as VCTK for multi-speaker speech generation, proprietary datasets for TTS in English and Mandarin, and MagnaTagATune and YouTube piano datasets for music modeling. These datasets provide diverse audio samples for training the generative models.", "Preprocessing": "Raw audio is preprocessed using \u00b5-law companding and quantized into 256 possible values. Linguistic features for TTS are derived from input texts, and additional conditioning information (e.g., speaker identity) is encoded appropriately for the model's conditioning mechanisms.", "Evaluation Metrics": "Evaluated using subjective listening tests, including MOS for naturalness and preference scores from paired comparison tests. Performance is compared against baseline TTS systems and assessed for the quality of generated music and phoneme recognition accuracy.", "Performance": "WaveNet achieves superior performance in TTS, with MOS scores above 4.0 for naturalness in both English and Mandarin, significantly better than baseline systems. It also performs well in generating music and phoneme recognition, showcasing its versatility and effectiveness in various audio generation tasks.", "Contributions": "", "Link": "https://arxiv.org/pdf/1609.03499", "Audio Samples": "https://drive.google.com/drive/folders/1hk-ZlVEzuK18eYZ8QaSeNau6h-LzaItc", "Template": "", "Last Accessed": "2024-07-15", "Checked": "0.0"}, {"Name": "", "Authors": "", "Description": "", "Training and Data": "", "Application": "", "Advantages": "", " Limitations": "", "Model Architecture": "", "Dependencies": "", "Synthesis": "", "Dataset": "", "Preprocessing": "", "Evaluation Metrics": "", "Performance": "", "Contributions": "", "Link": "", "Audio Samples": "", "Template": "", "Last Accessed": "NaT", "Checked": ""}, {"Name": "", "Authors": "", "Description": "", "Training and Data": "", "Application": "", "Advantages": "", " Limitations": "", "Model Architecture": "", "Dependencies": "", "Synthesis": "", "Dataset": "", "Preprocessing": "", "Evaluation Metrics": "", "Performance": "", "Contributions": "", "Link": "", "Audio Samples": "", "Template": "", "Last Accessed": "NaT", "Checked": ""}, {"Name": "", "Authors": "", "Description": "", "Training and Data": "", "Application": "", "Advantages": "", " Limitations": "", "Model Architecture": "", "Dependencies": "", "Synthesis": "", "Dataset": "", "Preprocessing": "", "Evaluation Metrics": "", "Performance": "", "Contributions": "", "Link": "", "Audio Samples": "", "Template": "", "Last Accessed": "NaT", "Checked": ""}, {"Name": "", "Authors": "", "Description": "", "Training and Data": "", "Application": "", "Advantages": "", " Limitations": "", "Model Architecture": "", "Dependencies": "", "Synthesis": "", "Dataset": "", "Preprocessing": "", "Evaluation Metrics": "", "Performance": "", "Contributions": "", "Link": "", "Audio Samples": "", "Template": "", "Last Accessed": "NaT", "Checked": ""}, {"Name": "", "Authors": "", "Description": "", "Training and Data": "", "Application": "", "Advantages": "", " Limitations": "", "Model Architecture": "", "Dependencies": "", "Synthesis": "", "Dataset": "", "Preprocessing": "", "Evaluation Metrics": "", "Performance": "", "Contributions": "", "Link": "", "Audio Samples": "", "Template": "", "Last Accessed": "NaT", "Checked": ""}, {"Name": "", "Authors": "", "Description": "", "Training and Data": "", "Application": "", "Advantages": "", " Limitations": "", "Model Architecture": "", "Dependencies": "", "Synthesis": "", "Dataset": "", "Preprocessing": "", "Evaluation Metrics": "", "Performance": "", "Contributions": "", "Link": "", "Audio Samples": "", "Template": "", "Last Accessed": "NaT", "Checked": ""}, {"Name": "", "Authors": "", "Description": "", "Training and Data": "\u200b", "Application": "", "Advantages": "", " Limitations": "", "Model Architecture": "", "Dependencies": "", "Synthesis": "", "Dataset": "", "Preprocessing": "", "Evaluation Metrics": "", "Performance": "", "Contributions": "", "Link": "", "Audio Samples": "", "Template": "", "Last Accessed": "NaT", "Checked": ""}]}, "lit_5": {"title": "papers without data", "icon": "fa-book", "data": [{"Author": "", "Title": "", "Where published": "", "When": "", "Dataset link": "Not Available", "Paper link": "", "Code Link": "", "Some description of the apporach": "", "Some description of the data (number of data points, any other featrues that describe the data": "", "License": "", "Google Doc link": ""}]}, "syl_0": {"title": "Sheet1", "icon": "fa-graduation-cap", "data": [{"CLASS NAME": "Dialogue Systems", "SCHOOL": "Georgetown University", "PROFESSOR": "Claire Bonial", "CONTACT": "claire.bonial@georgetown.edu", "SYLLABUS": "Open to sharing via email", "DESCRIPTION": "Nearly all of us interact with dialogue systems -- from calling up banks and hotels, to talking with intelligent assistants like Siri, Alexa, or Cortana, dialogue systems enable people to get tasks done with software agents using language. Since the interaction is bi-directional, we must consider the fundamentals of how people engage in conversation so as to manage users\u2019 expectations and track how information is exchanged in dialogue. Dialogue systems require an array of technologies to come together for them to work well, including speech recognition, natural language understanding, dialogue management, natural language generation, and speech synthesis. This course will explore what makes dialogue systems effective in commercial and research applications (ranging from personal assistants and chatbots to embodied conversational agents and language-directed robots) and how this contrasts with everyday human-human dialogue. This course will introduce students to the fundamentals of dialogue systems, expanding on technologies and algorithms that are used in today\u2019s dialogue systems and chatbots. There will also be emphasis on the psycholinguistic properties of human conversation (turn-taking, grounding) so as to prepare students for designing effective, user-friendly dialogue systems. The course will also include examining datasets and dialogue annotations used to train dialogue systems with machine learning algorithms. Coursework will consist of lectures, writing and programming assignments, and student-led presentations on special topics in dialogue. A final project will give students a chance to build their own dialogue system using open source and freely available software. This course is intended for students that are already comfortable with limited amounts of programming (in Python)."}, {"CLASS NAME": "Social Factors in Computational Linguistics and AI", "SCHOOL": "Georgetown University", "PROFESSOR": "Shabnam Tafreshi", "CONTACT": "st1093@georgetown.edu\nstafresh@umd.edu\nhttp://student.seas.gwu.edu/~shabnamt/", "SYLLABUS": "Open to sharing via email", "DESCRIPTION": "Advances in technologies for processing human languages have increasingly brought computational linguistics into contact with people. As such, what language reveals about people\u2014and how AI algorithms make decisions affecting people based on their language\u2014is of paramount concern. At the same time, contemporary algorithms for processing language offer powerful new tools for studying people and society on a large scale. Designed for students with grounding in computational linguistics, this course will examine the intersection of people, language, and algorithms with technical precision as well as an appreciation for human context. Topics will include: computational models of conversational interaction and power dynamics; emotions, sentiment, subjectivity, and politeness; toxic language; sociolinguistic variation; detection of attributes such as race and gender; issues of privacy, ethics, bias, and fairness, with special attention to minoritized speakers, languages, and dialects; and the use of large-scale language data for studying political framing and social movements like #MeToo and Black Lives Matter."}, {"CLASS NAME": "Computers and Language", "SCHOOL": "UC San Diego", "PROFESSOR": "Will Styler; Spring Quarter 2024", "CONTACT": "wstyler@ucsd.edu\nhttps://wstyler.ucsd.edu/6/", "SYLLABUS": "https://wstyler.ucsd.edu/6/", "DESCRIPTION": "As technology advances, we\u2019re relying more and more on computers and \u2018virtual assistants\u2019 to understand and interact with us using human language. In this course, we\u2019ll talk about the methods we use to help computers process, understand, analyze, and speak our language, and we\u2019ll talk about some of the linguistic realities that make human language so hard for computers to work with. No programming or linguistic background is needed.\nI think Week 9 (May 23) \"Conversational Interaction Design\" may be the most relevant!"}, {"CLASS NAME": "Human Language for Artificial Intelligence", "SCHOOL": "Carnegie Mellon", "PROFESSOR": "David R. Mortensen", "CONTACT": "dmortens@cs.cmu.edu", "SYLLABUS": "https://www.cs.cmu.edu/~dmortens/teaching/", "DESCRIPTION": "he is willing to share lecture notes if we email him\nAn enduring aspect of the quest to build intelligent machines is the challenge of human language. This course introduces students with a background in computer science and a research interest in artificial intelligence fields to the structure of natural language, from sound to society. It covers phonetics (the physical aspects of speech), phonology (the sound-structure of language), morphology (the structure of words), morphosyntax (the use of word and phrase structure to encode meaning), syntactic formalisms (using finite sets of production rules to characterize infinite configurations of structure), discourse analysis and pragmatics (language in discourse and communicative context), and sociolinguistics (language in social context and social meaning). Evaluation is based on seven homework assignments, a midterm examination, and a final examination."}, {"CLASS NAME": "Speech Technology", "SCHOOL": "The University of Arizona", "PROFESSOR": "Mike Hammond", "CONTACT": "hammond at u dot arizona dot edu", "SYLLABUS": "https://faculty.sbs.arizona.edu/hammond/ling578-sp20/syllabus.pdf", "DESCRIPTION": "Speech technology includes computer speech recognition and computer speech synthesis. This hands-on\ncourse begins with a review of basic phonetics and speech signal processing and then goes through the basic\nlogic and methodologies for speech synthesis and recognition. Programming expertise is not required, but\nmost assignments will have programming options for those interested.\n"}, {"CLASS NAME": "Speech Technology", "SCHOOL": "KTH Royal Institute of Technology", "PROFESSOR": "Joakim Gustafsson, Jens Edlund", "CONTACT": "edlund@speech.kth.se", "SYLLABUS": "https://www.kth.se/student/kurser/kurs/kursplan/DT2112-20212.pdf?lang=en", "DESCRIPTION": "The central part of the course concerns how speech can be used in human-computer interaction. Applications such as speaking and speech understanding computers and multimodal dialogue systems are presented. The course describes the basic concepts of human communication regarding speech, language and hearing. The use of digital signal analysis and statistical methods for analysis and classification of speech are also addressed, as are the evaluation, research and development of speech technology methods"}, {"CLASS NAME": "Spoken Language Processing", "SCHOOL": "Stanford ", "PROFESSOR": "Andrew Maas", "CONTACT": "amaas [a t} cs . stanford dot edu\nhttps://ai.stanford.edu/~amaas/", "SYLLABUS": "https://web.stanford.edu/class/cs224s/semesters/2024-spring/syllabus", "DESCRIPTION": "Introduction to spoken language technology with an emphasis on dialog and conversational systems. Deep learning and other methods for automatic speech recognition, speech synthesis, affect detection, dialogue management, and applications to digital assistants and spoken language understanding systems."}, {"CLASS NAME": "Ethical and Social Issues in Natural Language Processing", "SCHOOL": "Stanford ", "PROFESSOR": "Dan Jurafsky, Ria Kalluri, Peter Henderson\n", "CONTACT": "jurafsky@stanford.edu, pkalluri@stanford.edu, peter.henderson@princeton.edu", "SYLLABUS": "https://web.stanford.edu/class/cs384/", "DESCRIPTION": "We will cover ethical and social issues in NLP, especially focusing on large language models/foundation models. We'll cover research ethics, IRB, data and participatory research, harms and their mitigation, what models we should build and who should decide, and how to apply NLP to social questions about the justice system, framing and dehumanization, disinformation and toxicity, and for counter speech."}, {"CLASS NAME": "Human Language and Technology", "SCHOOL": "University of Southern California", "PROFESSOR": "Louis Goldstein", "CONTACT": "louisgol@usc.edu", "SYLLABUS": "https://web-app.usc.edu/soc/syllabus/20153/38838.pdf", "DESCRIPTION": "The everyday task of conversing, which usually seems close to effortless, requires us to carry out some very complex mental computations. Linguists, psychologists, and engineers have been trying to model this complexity in order to understand how speech and language work, leading to many innovations in technology. Speech recognition, dictation systems, grammar checkers, online searching, and dialog systems are becoming fundamental technologies. We will investigate significant aspects of human speech, and learn how scientific knowledge of this system is modeled computationally. This course will allow the student to learn about one of our species\u2019  greatest achievements, human language, and to appreciate how that knowledge, combined with a great deal of  computational creativity propels human technology. In gaining this knowledge, students will learn about how scientific innovation gives rise to a complex technological system.\n**I think this class has not been taught since 2015"}, {"CLASS NAME": "Speech Processing by Humans and Machines", "SCHOOL": "Boston University", "PROFESSOR": "Oded Ghitza", "CONTACT": "oghitza@bu.edu", "SYLLABUS": "https://www.bu.edu/eng/files/2020/02/Feb_2020-BEEC-519-Syllabus.pdf", "DESCRIPTION": "Speech (naturally spoken) is the main mode of communication between humans. Speech technology aims at providing the means for speech-controlled man-machine interaction. The goal of this course is to provide the basic concepts and theories of speech production, speech perception, and speech signal processing. The course is organized in a manner that builds a strong foundation of basics, followed by a range of signal processing methods for representing and processing the speech signal."}, {"CLASS NAME": "Language and Computers", "SCHOOL": "UT Austin", "PROFESSOR": "Jessy Li", "CONTACT": "jessy@austin.utexas.edu", "SYLLABUS": "https://utdirect.utexas.edu/apps/student/coursedocs/nlogon/download/8865162", "DESCRIPTION": "This undergraduate class looks at everyday tasks that involve natural language processing: document classification, spelling and grammar correction, dialogue systems, machine translation, cryptography and forensic linguistics. Students will get insight into how these systems work (and why it is still so difficult to do natural language processing well). We also consider social and ethical considerations such as privacy, job creation and loss due to language technologies, and the nature of machine intelligence."}, {"CLASS NAME": "Societal Impacts of Language Technology", "SCHOOL": "University of Washington", "PROFESSOR": "Emily M. Bender", "CONTACT": "ebender@uw.edu\nhttps://faculty.washington.edu/ebender/contact/ \nFrom her contact page \"Please include the word \"penguins\" in the subject line so that I know that you've read this page.\"\n", "SYLLABUS": "https://faculty.washington.edu/ebender/2023AU_575/#emerg", "DESCRIPTION": "The goal of this course is to better understand the ethical considerations that arise in the deployment of NLP technology, including how to identify people likely to be impacted by the use of the technology (direct and indirect stakeholders), what kinds of risks the technology poses, and how to design systems in ways that better support stakeholder values. Through discussions of readings in the growing research literature on fairness, accountability, transparency and ethics (FATE) in NLP and allied fields, and value sensitive design, we will seek to answer the following questions:\nWhat can go wrong, when we use NLP systems, in terms of specific harms to people?\nHow can fix/prevent/mitigate those harms?\nWhat are our responsibilities as NLP researchers and developers in this regard?\n"}, {"CLASS NAME": "Advanced Topics in Spoken Language Processing", "SCHOOL": "Columbia University", "PROFESSOR": "Julia Hirschberg", "CONTACT": "julia@cs.columbia.edu", "SYLLABUS": "https://www.cs.columbia.edu/~julia/courses/CS6998-24/syllabus24.html", "DESCRIPTION": "This class will introduce students to spoken language processing:  basic concepts, analysis approaches, and applications.  Applications include Text-to-Speech Synthesis, dialogue systems, and analysis of entrainment, empathy, personality, emotion, humor and sarcasm, deception and trust, radicalization and charisma, all using text and speech information and some visual features as well."}, {"CLASS NAME": "Finding Your Voice In the Era of AI", "SCHOOL": "University of Florida", "PROFESSOR": "Dr. Tina Tallon", "CONTACT": "tallonc@ufl.edu", "SYLLABUS": "https://undergrad.aa.ufl.edu/media/undergradaaufledu/uf-quest/quest-course-materials/quest-1-syllabi/Tallon--Fall-2023.pdf", "DESCRIPTION": "The voice is often referred to as the first instrument, and arguably, it is the instrument with which we are all most familiar. From the very moment we are born, we are all quite adept at using our voices to\nget what we want through a variety of vocalizations that become increasingly sophisticated and complex over time, ultimately shaping who we are and how we engage with the world around us. However,\ndespite this extreme familiarity and technical facility, the voice is also the instrument that most defies attempts at classification and theory \u2013 and especially, technological reproduction and mediation.\nArtificial intelligence is drastically changing the landscape of voice technology, and with it, our relationship to ourselves and those around us. In addition to its seemingly limitless expressive\ncapabilities, the voice is one of the most important sites for the construction and communication of identity, both individually and societally. Together, we will explore questions of embodiment, agency,\nand power through the context of the voice and its intersections with many aspects of our varied identities, including (but not limited to) race, ethnicity, gender, class, religion, age, sexual orientation,\nand (dis)ability, with an eye toward deepening our understanding of how our voices influence our own and other people\u2019s understandings of themselves in an increasingly diverse and technologicallymediated global society. This course is highly interdisciplinary in nature; readings, viewings, and listenings are drawn from a variety of sources including scientific journals, magazines and newspapers, works of art, and social media platforms like TikTok, in fields ranging from neuroscience, linguistics, and computer science to the performing arts, popular culture, and political science. Topics covered will include sonic cognition, linguistics, voice recording, transmission, and synthesis technologies, artificial intelligence and machine learning, disability, the media, and democracy and representation. Through hands-on creative and technical projects (such as creating AI-generated art, training a neural network using one\u2019s own voice, and producing a podcast episode), writing both an analytical paper and short self-reflection statements, and in-class discussions, we will explore what it means to have, to use, to generate, and to manipulate a voice in modern society \u2013 and what the future may hold for our voices."}, {"CLASS NAME": "Language and Computers", "SCHOOL": "University of Florida", "PROFESSOR": "Sarah Moeller", "CONTACT": "smoeller@ufl.edu", "SYLLABUS": "https://lin.ufl.edu/wp-content/uploads/sites/102/IDS2935-Language-and-Computers-Sp23-Moeller.pdf", "DESCRIPTION": "Language technology has a profound influence on the way ordinary people use language. This morning, because you speak English, you may have already used voice recognition or predictive text. This course explains what language technology is and how it is available for 1% of the world\u2019s languages. Along the way, we will attempt to answer a big pressing question for our society: Can artificial intelligence ever be inclusive of all 7000+ human languages? We will identify, describe, and explain the cross-disciplinary dimensions of this question which lie partly in social science principles of human communication (e.g. conversational turn-taking), partly in linguistics theory (e.g. how languages build words), and partly in the history of computer science (e.g. ASCII vs. Unicode). Topics include spellcheckers, translation, chatbots, and language learning aids. Topics are explored in the context of globalization, language endangerment, and the recent rapid rise of artificial intelligence."}, {"CLASS NAME": "Science and Analytics of Speech", "SCHOOL": "Rochester Institute of Technology", "PROFESSOR": "Cecilia Ovesdotter Alm", "CONTACT": "coagla@rit.edu", "SYLLABUS": "https://pht180.rit.edu/ceciliaovesdotteralm/wp-content/uploads/sites/11/2020/09/Syllabus_Speech_2201.pdf", "DESCRIPTION": "This course introduces students to the fields of experimental phonetics, the scientific study of the sounds used in human speech, and speech processing, the study of the speech signal used in automatic speech recognition, spoken emotion detection, and other technologies. Students will learn about the physiology of speech production and perception, and they will acquire the skills necessary to accurately describe speech concepts and to analyze speech using relevant methods and tools. Turning to speech processing technology, students will explore automatic speech recognition, speech synthesis, speaker identification, and emotion recognition, and learn how our understanding of human speech production and perception informs these technologies. The course will have relevance to other disciplines in the humanities, sciences, and technical fields. This course provides theoretical foundation as well as hands-on laboratory practice. "}, {"CLASS NAME": "", "SCHOOL": "", "PROFESSOR": "", "CONTACT": "", "SYLLABUS": "", "DESCRIPTION": ""}, {"CLASS NAME": "", "SCHOOL": "", "PROFESSOR": "", "CONTACT": "", "SYLLABUS": "", "DESCRIPTION": ""}, {"CLASS NAME": "", "SCHOOL": "", "PROFESSOR": "", "CONTACT": "", "SYLLABUS": "", "DESCRIPTION": ""}, {"CLASS NAME": "", "SCHOOL": "", "PROFESSOR": "", "CONTACT": "", "SYLLABUS": "", "DESCRIPTION": ""}, {"CLASS NAME": "", "SCHOOL": "", "PROFESSOR": "", "CONTACT": "", "SYLLABUS": "", "DESCRIPTION": ""}, {"CLASS NAME": "*CM and VJ -- reach out to see if folks are OK with us linking to their materials?", "SCHOOL": "", "PROFESSOR": "", "CONTACT": "", "SYLLABUS": "", "DESCRIPTION": ""}]}, "syl_1": {"title": "More Computer Sciencey Syllabi", "icon": "fa-graduation-cap", "data": [{"Unnamed: 0": "https://linguistics.osu.edu/sites/default/files/2023-12/LING3802_syllabus.pdf"}]}};
    let activeTabKey = null;

    function init() {
        const tabContainer = document.getElementById('tab-container');
        let isFirst = true;
        
        for (const [key, source] of Object.entries(EMBEDDED_DATA)) {
            const tab = document.createElement('div');
            tab.className = `tab-btn ${isFirst ? 'active' : ''}`;
            tab.id = `tab-btn-${key}`;
            tab.innerHTML = `<i class="fas ${source.icon}"></i> ${source.title}`;
            tab.onclick = () => {
                document.getElementById('search-input').value = ''; 
                loadTab(key);
            };
            tabContainer.appendChild(tab);
            if (isFirst) { 
                loadTab(key); 
                isFirst = false; 
            }
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const filterText = e.target.value.toLowerCase().trim();
            if (filterText === '') {
                if (activeTabKey) loadTab(activeTabKey);
            } else {
                renderGlobalSearch(filterText);
            }
        });
    }

    function loadTab(key) {
        activeTabKey = key;
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-btn-${key}`).classList.add('active');
        
        const source = EMBEDDED_DATA[key];
        document.getElementById('page-title').innerText = source.title;
        
        const data = source.data;
        if (!data || data.length === 0) {
            document.getElementById('table-container').innerHTML = '<div style="padding: 20px; color: #666;">No data found in this tab.</div>';
            return;
        }

        let html = `<div class="table-card"><div class="table-responsive">${buildTableHTML(data, "")}</div></div>`;
        document.getElementById('table-container').innerHTML = html;
    }

    function renderGlobalSearch(filterText) {
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        document.getElementById('page-title').innerText = `Search Results: "${filterText}"`;

        let finalHtml = '';
        let totalMatches = 0;

        for (const [key, source] of Object.entries(EMBEDDED_DATA)) {
            const data = source.data;
            if (!data || data.length === 0) continue;

            const tableHtml = buildTableHTML(data, filterText);
            if (tableHtml !== "") {
                const matchCount = (tableHtml.match(/<tr>/g) || []).length - 1;
                totalMatches += matchCount;
                
                finalHtml += `
                    <div class="global-search-title">
                        <i class="fas ${source.icon}"></i> <strong>${source.title}</strong> 
                        <span style="font-size: 14px; color: #64748b;">(${matchCount} results)</span>
                    </div>
                    <div class="table-card" style="margin-bottom: 30px;">
                        <div class="table-responsive">${tableHtml}</div>
                    </div>
                `;
            }
        }

        if (totalMatches === 0) {
            finalHtml = '<div style="padding: 20px; color: #64748b;">No matching results found across any tabs.</div>';
        }

        document.getElementById('table-container').innerHTML = finalHtml;
    }

    function buildTableHTML(data, filterText) {
        let matchCount = 0;
        const headers = Object.keys(data[0]);
        let tbodyHtml = '';

        data.forEach(row => {
            const rowValues = Object.values(row);
            if (filterText === "" || rowValues.join(' ').toLowerCase().includes(filterText)) {
                matchCount++;
                tbodyHtml += '<tr>';
                rowValues.forEach(val => {
                    let displayVal = val;
                    if (typeof val === 'string' && val.startsWith('http')) {
                        displayVal = `<a href="${val}" target="_blank" class="link-btn">Access Link <i class="fas fa-external-link-alt" style="font-size:11px;"></i></a>`;
                    }
                    tbodyHtml += `<td>${displayVal}</td>`;
                });
                tbodyHtml += '</tr>';
            }
        });

        if (matchCount === 0) return ""; 

        let tableHtml = '<table><thead><tr>';
        headers.forEach(h => tableHtml += `<th>${h}</th>`);
        tableHtml += `</tr></thead><tbody>${tbodyHtml}</tbody></table>`;
        
        return tableHtml;
    }

    window.onload = init;
</script>
