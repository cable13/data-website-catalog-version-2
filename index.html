aum-ai/assem-vc?tab=BSD-3-Clause-1-ov-file#", "Template ": "ASSEM-VC Template", "Last Accessed ": "2024-06-19", "Checked": "True"}, {"Data Name": "ASVspoof 2015(The First Automatic Speaker Verification Spoofing and Countermeasures Challenge)", "Authors": "Zhizheng Wu, Tomi Kinnunen, Nicholas Evans, Junichi Yamagishi, Cemal Hanil\u00e7i, Md Sahidullah, Aleksandr Sizov", "Description": "ASVspoof 2015 provides a standardized dataset to advance research in ASV spoofing detection, fostering the development of more generalizable countermeasures and enabling fair comparisons across different systems. The dataset includes genuine and spoofed speech, partitioned into training, development, and evaluation sets.", "Extra details": "Known Attacks: S1 (Frame Selection VC), S2 (C1 Adjustment VC), S3 (HMM-based SS with 20 utterances), S4 (HMM-based SS with 40 utterances), S5 (Voice Conversion Toolkit VC). Unknown Attacks: S6 (GMM-based VC), S7 (LSP-based VC), S8 (Tensor-based VC), S9 (KPLS VC), S10 (MaryTTS SS).", "creation method": "The dataset includes genuine and spoofed speech collected from 106 human speakers. Genuine speech was recorded without modification, while spoofed speech was created using various speech synthesis (SS) and voice conversion (VC) algorithms.", "Data type": "not specified", "Speakers (who they copied)": "Training: 25 speakers (10 male, 15 female), Development: 35 speakers (15 male, 20 female), Evaluation: 46 speakers (20 male, 26 female)", "Total size ": "Training: 16375, Development: 53372, Evaluation: 193404", "Real samples": "Training: 3750 genuine utterances, Development: 3497 genuine utterances, Evaluation: 9404 genuine utterances", "Fake Samples": "Training: 12625 spoofed utterances, Development: 49875 spoofed utterances, Evaluation: 184000 spoofed utterances", "average length": "Each utterance is approximately one to two seconds long.", "Keywords": "Speaker verification, Spoofing, Anti-spoofing, Countermeasure, Spoofing detection", "Published": "2 ent, creating highly realistic deepfakes. It includes various combinations of real and fake audio-visual segments, providing a comprehensive benchmark for state-of-the-art deepfake detection and localization methods.", "Extra details": "The dataset is specifically designed to detect partial manipulations embedded in real content. It is significantly larger and more challenging than previous deepfake datasets, featuring advanced manipulation strategies and high-quality content.", "creation method": "Generated using a pipeline that incorporates a large language model (ChatGPT) for transcript manipulations and the latest open-source audio-visual generation methods. Includes three manipulation strategies: word replacement, deletion, and insertion to create deepfakes.", "Data type": "Audio-visual data, .wav and video files with associated manipulations", "Speakers (who they copied)": "2,068 unique subjects", "Total size ": "1,886 hours of audio-visual data, 1,146,760 total videos", "Real samples": "286,721 real videos", "Fake Samples": "860,039 fake videos", "average length": "Each video varies in length but averages around 9 seconds", "Keywords": "Deepfake, Audio-visual, Temporal localization, LLM, Manipulation strategies, Detection, Benchmark", "Published": "2024", "Data Collection period": "", "Annotation Process": "Videos are labeled with frame-level, segment-level, and video-level annotations based on manipulations (replace, delete, insert) and modality (audio, visual, or both). Ground truth labels are used to evaluate deepfake localization performance.", "Usage scenarios": "Deepfake detection, temporal localiztion of manipulations, benchmark for deepfake research, training models to handle audio-visual content manipulation", "Technical Specifications": "", "Data Accessibility": "https://github.com/ControlNet/AV-Deepfake1M", "Challenges and Limitations": "", "main paper": "AV-Deepfake1M: A Large-Scale LLM-Driven Audio-Visual Deepfake Dataset (arxiv.org)", "Link": "[  "Checked": "True"}, {"Data Name": "Fake oR Real(FoR: A Dataset for Synthetic Speech Detection)", "Authors": "Ricardo Reimao, Vassilios Tzerpos", "Description": "The dataset contains synthetic speech from various TTS systems and real human speech, balanced and processed for machine learning tasks related to synthetic speech detection.", "Extra details": "Contains real speech recordings from different sources to ensure variety in gender, age, accent, and recording devices. The normalized version ensures consistency in sample rate, volume, and number of channels.", "creation method": "The dataset aggregates data from the latest TTS solutions (such as Deep Voice 3 and Google Wavenet TTS) as well as a variety of real human speech, including the Arctic Dataset, LJSpeech Dataset, VoxForge Dataset and our own speech recordings.", "Data type": "mp3, WAV", "Speakers (who they copied)": "Various, including those from the Arctic, LJSpeech, and VoxForge datasets, plus additional recordings.", "Total size ": "198000 files", "Real samples": "111000 files", "Fake Samples": "87000 files", "average length": "Real files: Average 5.05 seconds. Synthetic files: Average 2.35 seconds.\n", "Keywords": "Synthetic speech detection, deep neural networks, machine learning, text-to-speech, real speech, TTS systems.", "Published": "2019-11-21 00:00:00", "Data Collection period": "Not specified", "Annotation Process": "Includes balance adjustments for gender and class, normalization of audio parameters, and segmentation of long audio files.", "Usage scenarios": "Training classifiers to detect synthetic speech, research in speech synthesis, and adversarial networks for improving TTS systems.", "Technical Specifications": "Machine Learning Models: Various models including Random Forests, SVM, VGG16, VGG19, and Inception v3 were tested.", "Data Accessibility": "for-original, for-norm, for-2sec, for-rerec", "Challenges and Limitations": "", "main paper": "https://bil.eecs.yorku.ca/wp-content/uploads s.", "main paper": "https://arxiv.org/abs/2108.05080v4", "Link": "Github: https://github.com/DASH-Lab/FakeAVCeleb Website: https://sites.google.com/view/fakeavcelebdash-lab/home?authuser=0", "Original source link (if applicable)": "https://arxiv.org/abs/1806.05622", "License": "https://creativecommons.org/licenses/by/4.0/", "Template ": "FakeAVCeleb: A Novel Audio-Video Multimodal Deepfake Dataset Template", "Last Accessed ": "2024-06-24", "Checked": "True"}, {"Data Name": "H-Voice: Histograms of Original and Fake Voice Recordings", "Authors": "Dora M. Ballesteros, Yohanna Rodriguez, Diego Renza", "Description": "The dataset consists of 6672 histograms of voice recordings, both original and fake. It is organized into six directories for training, validation, and external testing, with histograms derived from both original and fake voice recordings using Imitation and Deep Voice methods.", "Extra details": "The dataset versions on Mendeley differ in the number of histograms. The latest version (version 4) contains 6672 histograms and has fixed corrupted images from previous versions.", "creation method": "The dataset was created by generating histograms from original and fake voice recordings. Fake recordings were created using Imitation and Deep Voice methods.", "Data type": "png", "Speakers (who they copied)": "Not specified", "Total size ": "6672 files", "Real samples": "Imitation: 3332, Synthetic: 4", "Fake Samples": "Imitation: 3264, Synthetuc: 72", "average length": "n/a (histograms)", "Keywords": " Fake voice, Machine learning, Convolutional neural networks, Binary classification, Imitation, Deep Voice, H-Voice", "Published": "2020-01-31 00:00:00", "Data Collection period": "Not specified", "Annotation Process": "Original and fake voice recordings were collected. Fake recordings were created using specified methods. Histograms of voice recordings were generated using Matlab code. Data was organized into specified directories for training, validation, and testing.", "Usage scenarios": "Training machine learning classifiers to identify fake voice recordings. Cross-validating and testing fake voice detection models. Developing anti-spoofing systems in speaker verification.", "Technical Specifications": "Histogram Bins: 216 bins", "Data Accessibility": "H-Voice: Fake voice histograms (Imitation+DeepVoice) - Mendeley Data", "Challenges and Limitations": "", "main paper": "https://doi.org/10.1016/j.dib.2020.105331", "Link": "https://www.sciencedirect.com/science/article/pii/S2352340920302250", "Original source link (if applicable)": "Deep Voice: https://audiodemos.github.io/, Imitation method: https://doi.org/10.17632/ytkv9w92t6.1", "License": "https://creativecommons.org/licenses/by/4.0/", "Template ": "H-Voice: A Dataset of Histograms of Original and Fake Voice Recordings Template", "Last Accessed ": "2024-06-24", "Checked": "True"}, {"Data Name": "The LJSpeech", "Authors": "Keith Ito and Linda Johnson", "Description": "The LJ Speech Dataset consists of 13,100 short audio clips of a single speaker reading non-fiction books. Each clip has an accompanying transcription and normalized transcription. The dataset is intended for training and evaluating speech synthesis systems.", "Extra details": "Each audio file is a single-channel 16-bit PCM WAV with a sample rate of 22050 Hz. Approximately 1-10 seconds", "creation method": "Audio recordings by a single speaker reading passages from 7 non-fiction books", "Data type": "WAV files", "Speakers (who they copied)": "1 speaker", "Total size ": "Approximately 24 hours", "Real samples": "13100 short audio clips", "Fake Samples": "", "average length": "6.57 seconds per clip", "Keywords": "Public domain, speech dataset, audio clips, transcription, single speaker, non-fiction books", "Published": "not specified", "Data Collection period": "The recordings were made during 2016-2017.", "Annotation Process": "Each audio clip has a corresponding transcription which includes the exact words spoken by the reader. transcription with numbers, ordinals, and monetary units expanded into full words.", "Usage scenarios": "training text-to-speech (TTS) models", "Technical Specifications": "Single-channel (mono) 16-bit PCM WAV files", "Data Accessibility": "Public", "Challenges and Limitations": "The dataset features only one speaker, limiting the variability in speech characteristics such as accent, tone, and pitch", "main paper": "Example code using this dataset can be found at https://github.com/keithito/tacotron", "Link": "https://keithito.com/LJ-Speech-Dataset/", "Original source link (if applicable)": "", "License": "This dataset is in the public domain in the USA (and most likely other countries as well). There are no restrictions on its use. For more information, please see: librivox.org/pages/public-domain.", "Template ": "The LJ Speech Dataset Template", "Last Accessed ": "2024-06-19", "Checked": "True"}, {"Data Name": "The M-AILABS Speech", "Authors": "M-AILABS", "Description": "The M-AILABS Speech Dataset provides extensive audio and text data for training speech recognition and synthesis models.", "Extra details": "Speech language is in German", "creation method": "sourced from LibriVox and Project Gutenberg", "Data type": "WAV files", "Speakers (who they copied)": "Audio was recorded by volunteers (LibriVox) and is in the public domain. Texts are in the public domain, published between 1884 and 1964", "Total size ": "18.7 hours", "Real samples": "9265", "Fake Samples": "806", "average length": "1-20 seconds", "Keywords": "Speech Recognition, Training Data", "Published": "3rd January 2019", "Data Collection period": "", "Annotation Process": "", "Usage scenarios": "Users can preprocess the data using existing tools that support the LJSpeech data format or perform their own preprocessing", "Technical Specifications": "", "Data Accessibility": "Public", "Challenges and Limitations": "", "main paper": "https://arxiv.org/ftp/arxiv/papers/2204/2204.05617.p  that the corpus was developed and compiled in the late 1980s.", "Usage scenarios": "Research in acoustic-phonetic studies. Dialect and linguistic analysis.", "Technical Specifications": "The waveform files (.wav) are typically sampled at 16 kHz. Usually 16-bit audio files", "Data Accessibility": "The dataset was originally distributed on CD-ROM and might now be available through specific research institutions or online repositories.", "Challenges and Limitations": "Limited dialect representation for certain regions, particularly the Western dialect where boundaries are less clearly defined.", "main paper": "https://nvlpubs.nist.gov/nistpubs/Legacy/IR/nistir4930.pdf", "Link": "https://github.com/philipperemy/timit?tab=readme-ov-file", "Original source link (if applicable)": "https://nvlpubs.nist.gov/nistpubs/Legacy/IR/nistir4930.pdf", "License": " No license specified, the work may be protected by copyright.", "Template ": "TIMIT Template", "Last Accessed ": "2024-06-19", "Checked": "True"}, {"Data Name": "VoxCeleb2", "Authors": "Joon Son Chung, Arsha Nagrani, Andrew Zisserman", "Description": "VoxCeleb2 contains audio-visual recordings from over 6,000 speakers, extracted from YouTube videos. The recordings are 'in the wild,' containing various background noises and conditions, making it suitable for training robust speaker recognition systems.", "Extra details": "The dataset includes videos shot in diverse environments such as red carpets, outdoor stadiums, and indoor settings, which include speeches and interviews. It provides data with varied accents, ethnicities, and languages from speakers of 145 different nationalities.", "creation method": "Data collected from YouTube videos using an automatic computer vision pipeline involving stages of face and voice detection, verification, and active speaker verification.", "Data type": "Audio-visual", "Speakers (who they copied)": "6000 speakers", "Total size ": "Over 1 million utterances", "Real samples": "All samples are real-world recordings; no specific number for 'real' samples as all are from actual video uploads", "Fake Samples": "", "average length": "Average length of utterances is approximately 7.8 seconds.", "Keywords": "speaker identification, speaker verification, large-scale, dataset, convolutional neural network", "Published": "2018-06-27 00:00:00", "Data Collection period": "", "Annotation Process": "Automated annotations are done using tools like SyncNet to verify the active speaker; face and voice verification algorithms classify and verify the data without manual labeling.", "Usage scenarios": "Suitable for tasks like speaker verification, speaker identification, and other audio-visual machine learning applications like visual speech synthesis, speech separation, and cross-modal learning.", "Technical Specifications": "", "Data Accessibility": "", "Challenges and Limitations": "", "main paper": "https://arxiv.org/abs/1806.05622", "Link": "https://www.robots.ox.ac.uk/~vgg/data/voxceleb/vox2.html", "Original source link (if applicable)": "", "License": "http://creativecommons.org/licenses/by-sa/4.0/", "Template ": "", "Last Accessed ": "2024-07-18", "Checked": "True"}, {"Data Name": "WaveFake", "Authors": "Joel Frank, Lea Sch\u00f6nherr\n", "Description": "WaveFake is a dataset designed to facilitate research into audio Deepfakes. It consists of 16-bit PCM wav files generated by various neural networks. These networks were trained on reference datasets (LJSPEECH and JSUT) and used to create fake audio samples.", "Extra details": "Generative Models: Included various architectures like MelGAN, Parallel WaveGAN, Multi-Band MelGAN, Full-Band MelGAN, HiFi-GAN, WaveGlow, and a TTS pipeline", "creation method": "Based on LJSpeech and JSUT datasets", "Data type": "16-bit PCM WAV files", "Speakers (who they copied)": "2 speakers (one for each reference dataset).", "Total size ": "approximately 196 hours", "Real samples": "Not specified", "Fake Samples": "117985 generated audio samples", "average length": "The average length of the clips is around 4.8 seconds (JSUT), 6 seconds (LJSpeech), and (3.8 seconds) Text-to-Speech with the dataset totaling approximately 175 hours", "Keywords": "Audio Deepfakes, Generative models, MelGAN, parallel WaveGAN, multi-band MelGAN, full-band MelGAN,HiFi-GAN, Text-to-Speech", "Published": "2021-08-26 00:00:00", "Data Collection period": "Data collection occurred from May to September 2021", "Annotation Process": "Not specified", "Usage scenarios": "The intended use of the dataset is to facilitate research into detecting audio Deepfakes", "Technical Specifications": "File format: 16-bit PCM wav files", "Data Accessibility": "https://doi.org/10.5281/zenodo.5642694", "Challenges and Limitations": "The dataset contains only generated (fake) samples, not the real training data", "main paper": "https://arxiv.org/abs/2111.02813", "Link": "https://github.com/RUB-SysSec/WaveFake?tab=readme-ov-file", "Original source link (if applicable)": "LJSpeech: https://keithito.com/LJ-Speech-Dataset/ , JSTU: https://sites.google.com/site/shinnosuketakamichi/publication/jsut", "License": "https://github.com/RUB-SysSec/WaveFake/blob/main/LICENSE", "Template ": "WaveFake Template", "Last Accessed ": "2024-06-19", "Checked": "True"}, {"Data Name": "In the wild", "Authors": "Nicolas M. Muller, Pavel Czempin, Franziska Dieckmann, Adam Froghyar, Konstantin Bottinger", "Description": " The dataset contains both bona-fide (real) and deepfake (spoofed) audio clips of 58 English-speaking celebrities and politicians. It is designed to test the generalization capabilities of machine learning models for audio deepfake detection in realistic, in-the-wild environments. The real and spoofed audio clips have similar styles, emotions, and background noise, ensuring realistic comparisons.", "Extra details": "The spoofed audio is sourced from TTS algorithms, and the genuine audio is manually collected from public sources such as podcasts and speeches. The dataset is especially intended for the evaluation of audio deepfake detection models.", "creation method": "The dataset was created by collecting both bona-fide (real) and deepfake (spoofed) audio recordings of celebrities and politicians from publicly available sources such as social networks and video streaming platforms. Spoofed audio is generated through text-to-speech (TTS) algorithms from these public figures.", "Data type": "Audio files", "Speakers (who they copied)": "58 celebrities", "Total size ": "approximately 38 hours", "Real samples": "20.8 hours of bona-fide audio", "Fake Samples": "17.2 hours of spoofed audio", "average length": "23 minutes of bona-fide and 18 minutes of spoofed audio per speaker", "Keywords": "audio deepfake detection, machine learning, speech spoofing, deep learning, celebrities, politicians, text-to-speech, TTS, real-world dataset", "Published": "2022", "Data Collection period": "", "Annotation Process": "Manual annotation by matching genuine and deepfake audio clips of the same speakers based on similar styles, emotions, and noise levels.", "Usage scenarios": "Generalization testing of deepfake detection models. Evaluating machine learning models in detecting audio spoofs from real-world, in-the-wild environments.", "Technical Specifications": "", "Data Accessibility": "https://owncloud.fraunhofer.de/index.php/s/JZgXh0JEAF0elxa", "Challenges and Limitations": "", "main paper": "https://arxiv.org/abs/2203.16263", "Link": "https://deepfake-total.com/in_the_wild", "Original source link (if applicable)": "", "License": "https://www.apache.org/licenses/LICENSE-2.0", "Template ": "In the wild Template", "Last Accessed ": "2024-10-04", "Checked": "True"}, {"Data Name": "Bridge2AI-Voice", "Authors": "Alistair Johnson, Jean-Christophe B\u00e9lisle-Pipon, David Dorr, Satrajit Ghosh, Philip Payne, Maria Powell, Ana\u00efs Rameau, Vardit Ravitsky, Alexandros Sigaras, Olivier Elemento, Yael Bensoussan ", "Description": "The dataset comprises voice recordings and associated clinical information aimed at enabling the development, benchmarking, and validation of machine-learning models for diagnosing a wide range of health conditions. The initial release includes spectrograms, acoustic features, phonetic and prosodic features, and transcriptions derived from the raw audio data.", "Extra details": "The dataset focuses on five disease categories where voice changes are associated with specific conditions: Vocal Pathologies, Neurological and Neurodegenerative Disorders, Mood and Psychiatric Disorders, Respiratory Disorders, and Pediatric Diseases.", "creation method": "Voice recordings and corresponding clinical data were collected from participants across five North American sites. Participants were selected based on conditions known to affect voice, including voice disorders, neurological disorders, mood disorders, and respiratory disorders. Data collection involved standardized protocols, including demographic information, health questionnaires, and specific voice recording tasks.", "Data type": "Derived data including spectrograms, acoustic features, phonetic and prosodic features, and transcriptions.", "Speakers (who they copied)": "306 participants", "Total size ": "12523 recordings", "Real samples": "12523 recordings", "Fake Samples": "", "average length": "Not specified", "Keywords": "Voice, Biomarker, Health, AI, Machine Learning, Speech Analysis, Clinical Diagnosis", "Published": "2024-11-27 00:00:00", "Data Collection period": "", "Annotation Process": "Derived features were extracted using tools like OpenSMILE, Praat, Parselmouth, and OpenAI's Whisper Large model. De-identification steps were taken to ensure privacy, including the removal of HIPAA Safe Harbor identifiers and transcripts of free speech audio.", "Usage scenarios": "The dataset is intended for research into using voice as a biomarker for health, facilitating the development of AI models for screening, diagnosis, and treatment of various diseases.", "Technical Specifications": "", "Data Accessibility": "https://docs.b2ai-voice.org/", "Challenges and Limitations": "", "main paper": "", "Link": "https://healthdatanexus.ai/content/b2ai-voice/1.0/", "Original source link (if applicable)": "https://github.com/sensein/b2aiprep", "License": "https://healthdatanexus.ai/content/b2ai-voice/view-license/1.0/", "Template ": "Bridge2AI-Voice Template", "Last Accessed ": "2024-12-12", "Checked": "False"}, {"Data Name": "RFP dataset for Real, Fake, and Partially fake audio detection", "Authors": "Abdulazeez AlAli and George Theodorakopoulos", "Description": "The RFP dataset consists of five types of audio: real, TTS (text-to-speech), VC (voice conversion), audio with noise, and partially fake (PF) audio. The PF audio is a combination of real and fake segments, addressing the gap in existing datasets that only focus on entirely fake audio. The dataset is designed to train and evaluate fake audio detection models, especially focusing on the more challenging partial fake detection.", "Extra details": "Two versions of the dataset: original (unprocessed) and normalized (processed and ready for machine learning). Real audio files are sourced from various open datasets, ensuring a diverse range of accents, noise levels, and recording conditions.", "creation method": "Real audio: Collected from YouTube-8M, UK/Ireland English Dialect dataset, DiPCo dataset, and VCTK dataset. Fake audio (TTS): Generated using high-level TTS platforms (e.g., Amazon Polly, Windows Azure, Google Cloud TTS), each with different accents and genders. Voice Conversion (VC): Generated using open-source tools (e.g., Soft-VC, Free-VC, PPG-VC, Diff-VC). Audio with noise: Real and TTS audio mixed with various types of noise (e.g., indoor, outdoor). Partial Fake (PF) audio: Created by combining real and fake audio in four configurations (e.g., Real-Fake-Real, Fake-Real-Fake).", "Data type": "WAV, MP3, FLAC formats (sampling rates from 16kHz to 48kHz; processed to 16kHz mono WAV for machine learning).", "Speakers (who they copied)": "354 speakers (184 male, 170 female)", "Total size ": "127,862 utterances", "Real samples": "33223 real samples", "Fake Samples": "94,639 fake samples (including TTS, VC, Noisy and PF samples)", "average length": "RFP Normalised Version: 3 to 20 seconds per utterance", "Keywords": "Dataset, Deepfake, Synthetic Speech, Partial Fake, Spoofing Detection", "Published": "2024", "Data Collection period": "", "Annotation Process": "Transcripts were generated for most real and TTS audio files using the Whisper model. The dataset includes metadata like speaker information, noise type, and real/fake labels.", "Usage scenarios": "The dataset is intended for training and evaluating models for fake audio detection, spoofing detection, replay attacks, and automatic speaker verification (ASV).", "Technical Specifications": "", "Data Accessibility": "https://zenodo.org/records/10202142", "Challenges and Limitations": "", "main paper": "https://arxiv.org/pdf/2404.17721", "Link": "https://link.springer.com/chapter/10.1007/978-981-97-3973-8_1", "Original source link (if applicable)": "", "License": "https://creativecommons.org/licenses/by/4.0/legalcode", "Template ": "RFP Dataset Template", "Last Accessed ": "2024-10-13", "Checked": "True"}]}, "lit_2": {"title": "Generation Models", "icon": "fa-book", "data": [{"Name": "AdaSpeech", "Authors": "Mingjian Chen, Xu Tan, Bohan Li, Yanqing Liu, Tao Qin, Sheng Zhao, Tie-Yan Liu", "Description": "AdaSpeech is an adaptive text-to-speech (TTS) system designed to customize new voices efficiently and with high quality. It addresses the challenges of diverse acoustic conditions and memory efficiency in custom voice adaptation.", "Training and Data": "AdaSpeech employs a three-stage pipeline: pre-training on a large multi-speaker dataset, fine-tuning on target speaker data with diverse acoustic conditions, and inference using a combination of shared and speaker-specific parameters.", "Application": "", "Advantages": "AdaSpeech handles diverse acoustic conditions, uses minimal adaptation parameters (about 5K per speaker), and achieves high-quality custom voice adaptation.", " Limitations": "The model requires external tools for accurate alignment and pitch extraction. Future work could explore fully end-to-end solutions without these dependencies and further optimize adaptation for more diverse acoustic conditions.", "Model Architecture": "The model is based on FastSpeech 2 and includes a phoneme encoder, mel-spectrogram decoder, variance adaptor, and two additional components: acoustic condition modeling and conditional layer normalization for efficient adaptation.", "Dependencies": "Dependencies include PyTorch for model training, MFA for phoneme duration extraction, and MelGAN for waveform synthesis. Computational resources include GPUs for efficient training and adaptation.", "Synthesis": "The system uses a combination of phoneme encoding, variance adaptation, mel-spectrogram decoding, and acoustic condition modeling to generate high-quality speech. The acoustic conditions are modeled at both utterance and phoneme levels.", "Dataset": "Pre-trained on LibriTTS, fine-tuned on VCTK and LJSpeech datasets, covering a wide range of acoustic conditions.", "Preprocessing": "Speech data is converted to 16kHz sampling rate and mel-spectrograms with 12.5ms hop size and 50ms window size. Text is converted to phoneme sequences for encoder input.", "Evaluation Metrics": "MOS and SMOS for perceptual quality and similarity, number of adaptation parameters for memory efficiency, and qualitative analysis of acoustic condition modeling using t-SNE visualizations.", "Performance": "AdaSpeech achieves higher MOS and SMOS scores compared to baselines, demonstrating better adaptation quality with minimal parameters. It also shows robustness across different datasets with varying acoustic conditions.", "Contributions": "Introduced a novel approach to adaptive TTS with efficient parameter usage and high-quality voice synthesis, demonstrated through comprehensive evaluations.", "Link": "https://arxiv.org/pdf/2103.00993", "Audio Samples": "", "Template": "AdaSpeech Template", "Last Accessed": "2024-07-17", "Checked": "0.0"}, {"Name": "Char2Wav", "Authors": "Jose Sotelo, Soroush Mehri, Kundan Kumar, Joao Felipe Santos, Kyle Kastner, Aaron Courville, Yoshua Bengio", "Description": "The paper presents Char2Wav, an end-to-end model for speech synthesis with two main components: a reader (encoder-decoder model with attention) and a neural vocoder (conditional SampleRNN). The reader converts text or phonemes to vocoder acoustic features, and the neural vocoder generates raw waveform samples.", "Training and Data": "The reader and neural vocoder are pretrained separately using normalized WORLD vocoder features, and then fine-tuned end-to-end. The reader uses a bidirectional RNN encoder and an RNN decoder with attention, while the neural vocoder uses a conditional version of SampleRNN to generate raw waveforms.", "Application": "", "Advantages": "Eliminates the need for expert linguistic knowledge and simplifies the creation of speech synthesizers for new languages. Learns the entire process end-to-end, capturing long-term dependencies and producing high-quality audio directly from text.", " Limitations": "Quantitative evaluation and comparison with other models are not provided in the paper. The performance may vary with different datasets and languages.", "Model Architecture": "The reader consists of a bidirectional RNN encoder and an RNN decoder with attention. The neural vocoder is a conditional SampleRNN that captures long-term dependencies in sequential data, using a hierarchical structure to model dynamics at different time scales.", "Dependencies": "Dependencies include PyTorch for neural network implementation, WORLD vocoder for feature extraction, and SampleRNN for neural vocoder implementation.", "Synthesis": "Uses normalized WORLD vocoder features as intermediate representations. The reader converts text or phonemes to vocoder features, and the neural vocoder (conditional SampleRNN) generates raw waveform samples from these features.", "Dataset": "The VCTK dataset for English and the DIMEX-100 dataset for Spanish were used for training and evaluation. The VCTK dataset contains recordings of multiple speakers, while the DIMEX-100 dataset includes Spanish text and corresponding recordings.", "Preprocessing": "Preprocessing involves normalizing WORLD vocoder features, which include Mel-cepstral coefficients (MCCs), logarithmic fundamental frequency (log F0), and aperiodicities (APs). These features are used as targets for the reader and inputs for the neural vocoder during pretraining.", "Evaluation Metrics": "Subjective evaluation based on the intelligibility and naturalness of the generated speech. Samples provided for qualitative assessment.", "Performance": "Char2Wav generates intelligible and natural-sounding speech directly from text, with subjective evaluation demonstrating high-quality speech synthesis for different languages. The model's hierarchical structure and attention mechanism contribute to capturing long-term dependencies and generating realistic audio", "Contributions": "End-to-End TTS: The paper introduces an end-to-end approach for TTS that eliminates the need for expert-crafted linguistic features. Neural Vocoder: Integration of a conditional SampleRNN as a neural vocoder capable of producing raw audio waveforms from acoustic features. Attention-based Encoder-Decoder: Employs an attention-based mechanism for aligning input text with output audio, improving the quality of the generated speech.", "Link": "https://openreview.net/pdf?id=B1VWyySKx", "Audio Samples": "", "Template": "Char2Wav Template", "Last Accessed": "2024-07-11", "Checked": "0.0"}, {"Name": "CycleGAN-VC", "Authors": "Takuhiro Kaneko, Hirokazu Kameoka", "Description": "A voice conversion method that does not rely on parallel data, using Cycle-Consistent Adversarial Networks (CycleGANs) with gated convolutional neural networks (CNNs) and an identity-mapping loss.", "Training and Data": "Uses CycleGAN with adversarial loss and cycle-consistency loss for training, incorporating gated CNNs for capturing sequential and hierarchical structures, and an identity-mapping loss to preserve linguistic information.", "Application": "", "Advantages": "No need for parallel data, extra modules, or alignment procedures. Reduces over-smoothing and captures spectrotemporal structures effectively.", " Limitations": "While the method showed competitive performance, there is still a quality gap between the original and converted speech.", "Model Architecture": "The generator uses a 1D CNN for capturing overall feature relationships while preserving temporal structure, incorporating gated linear units (GLUs) as activation functions. The discriminator uses a 2D CNN to focus on 2D spectral textures.", "Dependencies": "The method relies on CycleGAN architecture, gated CNNs, and the WORLD vocoder for speech analysis and synthesis. Implements using libraries such as PyTorch for neural networks, and optimization with the Adam optimizer.", "Synthesis": "Converts Mel-cepstral coefficients (MCEPs), logarithmic fundamental frequency (log F0), and aperiodicities (APs) using the WORLD analysis system. MCEPs are learned with CycleGAN-VC, log F0 is converted using logarithm Gaussian normalized transformation, and APs are used without modification.", "Dataset": "Voice Conversion Challenge 2016 (VCC 2016) dataset with manual segmentation into 216 short parallel sentences, divided into training and evaluation sets.", "Preprocessing": "Preprocesses the speech data by downsampling to 16 kHz, extracting 24 Mel-cepstral coefficients (MCEPs), logarithmic fundamental frequency (log F0), and aperiodicities (APs) every 5 ms using the WORLD analysis system. Normalizes the source and target MCEPs per dimension before training.", "Evaluation Metrics": "Mean Opinion Score (MOS) for naturalness and speaker similarity, Global Variance (GV), and Modulation Spectra (MS).", "Performance": "The CycleGAN-VC model is evaluated for naturalness and speaker similarity through subjective listening tests. Objective metrics such as Global Variance (GV) and Modulation Spectra (MS) show that the converted feature sequences are close to the target. The method outperforms the GMM-based baseline in subjective evaluations for naturalness.", "Contributions": "Introduced a parallel-data-free VC method using CycleGAN, demonstrated its effectiveness in capturing spectrotemporal structures and reducing over-smoothing, and provided a general framework applicable to various VC tasks.", "Link": "https://arxiv.org/pdf/1711.11293", "Audio Samples": "", "Template": "CycleGAN-VC Template", "Last Accessed": "2024-07-10", "Checked": "0.0"}, {"Name": "Deep Voice 3", "Authors": "Wei Ping, Kainan Peng, Andrew Gibiansky, Sercan O. Ar\u0131k, Ajay Kannan, Sharan Narang", "Description": "Deep Voice 3 is a fully-convolutional, attention-based neural text-to-speech (TTS) system designed to match state-of-the-art naturalness in synthesized speech while training significantly faster than other models. It scales to large datasets and can handle multiple speakers.", "Training and Data": "Deep Voice 3 uses a fully-convolutional sequence-to-sequence architecture with attention mechanisms. The model is trained on large datasets, including LibriSpeech with 820 hours of audio. The model architecture allows parallel computation, leading to significantly faster training times compared to recurrent models.", "Application": "", "Advantages": "Deep Voice 3 offers an order of magnitude faster training compared to Tacotron, scales to very large datasets, handles multiple speakers effectively, and achieves high naturalness in synthesized speech. The model can be efficiently deployed to handle high query throughput on GPU servers.", " Limitations": "The quality of synthesized speech depends on the waveform synthesis method used. While WaveNet provides the highest naturalness, it has higher inference latency compared to WORLD or Griffin-Lim. The model's performance on noisy datasets like LibriSpeech is lower due to varying recording conditions and background noise.", "Model Architecture": "The architecture consists of three main components: an encoder, a decoder, and a converter. The encoder converts text into internal representations, the decoder uses these representations to predict mel-spectrograms, and the converter generates vocoder parameters for waveform synthesis. The architecture is fully-convolutional and attention-based.", "Dependencies": "Dependencies include TensorFlow or PyTorch for model training and inference, librosa for audio processing and spectrogram computation, and specific vocoder implementations like WORLD and WaveNet. Custom GPU kernels are implemented for optimized inference speed and handling high query throughput.", "Synthesis": "Uses attention-based sequence-to-sequence conversion from text to mel-spectrograms, followed by vocoder parameter prediction for waveform synthesis. Supports multiple vocoder methods, including Griffin-Lim, WORLD, and WaveNet, allowing flexibility in choosing the synthesis method based on quality and computational requirements.", "Dataset": "Used LibriSpeech (820 hours, 2484 speakers) for large-scale training, VCTK (44 hours, 108 speakers) for multi-speaker synthesis, and an internal single-speaker dataset (20 hours, 48 kHz) for single-speaker synthesis. Text preprocessing includes converting text to phonemes and normalizing punctuation and spacing.", "Preprocessing": "Text preprocessing includes converting text to phonemes, uppercasing characters, removing intermediate punctuation marks, and replacing spaces with special separator characters to indicate pause durations. Audio preprocessing involves converting waveforms to mel-spectrograms and other vocoder parameters.", "Evaluation Metrics": "Evaluated using MOS for naturalness, attention error counts for repeated words, mispronunciations, and skipped words, and training and inference speed comparisons. Evaluations included multiple waveform synthesis methods (Griffin-Lim, WORLD, WaveNet) and comparisons with Tacotron and Deep Voice 2.", "Performance": "Deep Voice 3 achieves a 10x speedup in training compared to Tacotron, converging in approximately 500k iterations. Inference speed reaches 115 queries per second on a single Nvidia Tesla P100 GPU with custom GPU kernels, enabling deployment to handle ten million queries per day. MOS ratings indicate high naturalness for synthesized speech. Demonstrates strong performance on multi-speaker datasets like VCTK and LibriSpeech, with speaker embeddings providing a meaningful latent space.\n", "Contributions": "", "Link": "https://arxiv.org/pdf/1710.07654", "Audio Samples": "", "Template": "Deep Voice 3 Template", "Last Accessed": "2024-07-15", "Checked": "0.0"}, {"Name": "DenoiSpeech", "Authors": "Chen Zhang, Yi Ren, Xu Tan, Jinglin Liu, Kejun Zhang, Tao Qin, Sheng Zhao, Tie-Yan Liu", "Description": "DenoiSpeech is a text-to-speech (TTS) system designed to synthesize clean speech from noisy speech data. It uses a fine-grained frame-level noise condition module that models noise at a detailed level, outperforming previous methods that use coarse-grained or pre-enhanced speech data.", "Training and Data": "DenoiSpeech uses joint training for the TTS model and the noise condition module, with a noise extractor that leverages both paired and unpaired noisy data. The noise extractor and the TTS model are optimized together to improve the overall performance and generalization.", "Application": "", "Advantages": "DenoiSpeech significantly improves the quality of synthesized speech over previous methods, especially in real-world noisy conditions. It uses fine-grained frame-level noise conditions to model complex noise patterns, resulting in clearer and more natural synthesized speech.", " Limitations": "The model requires careful tuning of the noise extractor and noise encoder. Real-world performance might still depend on the diversity and representativeness of the training data. Further improvements could explore handling even more diverse types of noise and applying few-shot learning.", "Model Architecture": "The architecture includes a phoneme encoder, length regulator, noise condition module, pitch predictor, and mel-spectrogram decoder. The noise condition module contains a noise extractor (based on UNet) and a noise encoder, along with an adversarial CTC module to ensure noise-only extraction.", "Dependencies": "Dependencies include PyTorch for model training, UNet for noise extraction, FastSpeech 2 for TTS model structure, and various tools for phoneme conversion, mel-spectrogram extraction, and audio preprocessing. Computational resources include GPUs for efficient training.", "Synthesis": "Uses a combination of phoneme encoding, length regulation, noise condition modeling, pitch prediction, and mel-spectrogram decoding to generate high-quality speech from noisy inputs. The noise condition module captures detailed noise information to enhance synthesis quality.", "Dataset": "The datasets include VCTK corpus for clean speech and NonSpeech100 for noise in artificial noisy datasets, and an internal dataset for real-world noisy speech. These datasets provide a range of noise conditions for robust training and evaluation.", "Preprocessing": "Speech data is preprocessed into phoneme sequences and mel-spectrograms. Phoneme conversion uses an open-source tool, and mel-spectrogram extraction follows established parameters (frame size of 50 ms, hop size of 12.5 ms, and sample rate of 22050 Hz) for consistency.", "Evaluation Metrics": "Evaluated using MOS tests to measure perceptual quality, comparing synthesized speech against ground truth clean recordings, noisy recordings, and baseline methods. MOS scores are recorded with native speakers rating the audio quality.", "Performance": "DenoiSpeech achieves higher MOS scores compared to baseline methods, demonstrating superior audio quality and robustness in noisy conditions. The model efficiently handles complex noise patterns, ensuring clear and natural synthesized speech in various noisy environments.", "Contributions": "Introduced a novel frame-level noise modeling approach for TTS, demonstrated significant improvements in audio quality over previous methods, provided comprehensive evaluations on artificial and real-world datasets, and released audio samples and implementation details for reproducibility.", "Link": "https://arxiv.org/pdf/2012.09547", "Audio Samples": "", "Template": "DenoiSpeech Template", "Last Accessed": "2024-07-17", "Checked": "0.0"}, {"Name": "FastSpeech 2", "Authors": "Yi Ren, Chenxu Hu, Xu Tan, Tao Qin, Sheng Zhao, Zhou Zhao, Tie-Yan Liu", "Description": "FastSpeech 2 is a non-autoregressive text-to-speech (TTS) model designed to synthesize speech faster and with higher quality than previous models. It addresses the limitations of FastSpeech by using ground-truth data for training and incorporating additional speech variation information such as pitch, energy, and accurate duration.", "Training and Data": "FastSpeech 2 directly trains the model with ground-truth mel-spectrograms, pitch, energy, and accurate duration extracted from speech waveforms. The model uses a simplified training pipeline without the need for a teacher model and distillation process. FastSpeech 2s extends this by generating speech waveforms directly from text, further simplifying the process.", "Application": "", "Advantages": "FastSpeech 2 simplifies the training process, improves speech quality by using ground-truth data, and incorporates detailed speech variation information to better handle the one-to-many mapping problem. FastSpeech 2s further simplifies the inference process by generating waveforms directly, leading to faster inference speeds.", " Limitations": "The model requires external tools for accurate alignment and pitch extraction, which adds some complexity. Real-world performance might still depend on the quality and representativeness of the training data. Further improvements could explore simplifying the process even more and incorporating more variation information.", "Model Architecture": "The architecture includes an encoder, a variance adaptor (with duration, pitch, and energy predictors), and a mel-spectrogram decoder. FastSpeech 2s adds a waveform decoder that directly generates speech waveforms from the text. The variance adaptor uses continuous wavelet transform for pitch prediction and introduces adversarial training in the waveform decoder for phase recovery.", "Dependencies": "Dependencies include PyTorch for model training, MFA for phoneme duration extraction, PyWorldVocoder for pitch extraction, and Parallel WaveGAN for waveform synthesis. Computational resources include GPUs for efficient training.", "Synthesis": "Uses a combination of phoneme encoding, variance adaptation (with duration, pitch, and energy predictors), and mel-spectrogram or waveform decoding to generate high-quality speech. The variance adaptation module provides detailed information to handle the one-to-many mapping problem in TTS effectively.", "Dataset": "The LJSpeech dataset, containing 13,100 English audio clips and corresponding text transcripts, is used for training and evaluation. The dataset is preprocessed into phoneme sequences and mel-spectrograms for training FastSpeech 2 and waveform clips for FastSpeech 2s.", "Preprocessing": "Text data is converted into phoneme sequences using a grapheme-to-phoneme tool. Speech data is transformed into mel-spectrograms with specific frame size of 1024 and hop sizes of 256, and pitch and energy are extracted from the speech waveform for training the variance predictors.", "Evaluation Metrics": "MOS and CMOS tests for perceptual quality, standard deviation, skewness, kurtosis, and average DTW distance for pitch accuracy, and mean absolute error (MAE) for energy similarity to ground-truth speech. Training and inference speeds are measured in terms of real-time factor (RTF).", "Performance": "FastSpeech 2 achieves higher MOS scores and faster training times compared to FastSpeech and autoregressive models. FastSpeech 2s further improves inference speed by directly generating waveforms, making it suitable for real-time applications while maintaining high audio quality.", "Contributions": "Introduced a simplified and more effective training pipeline for TTS, demonstrated significant improvements in audio quality and training/inference speed, provided comprehensive evaluations and analyses, and released audio samples and implementation details for reproducibility.", "Link": "https://arxiv.org/pdf/2006.04558", "Audio Samples": "", "Template": "FastSpeech 2 Template", "Last Accessed": "2024-07-17", "Checked": "0.0"}, {"Name": "Glow TTS", "Authors": "Jaehyeon Kim, Sungwon Kim, Jungil Kong, Sungroh Yoon", "Description": "Glow-TTS is a flow-based generative model for parallel text-to-speech (TTS) synthesis that eliminates the need for external aligners by internally learning the alignment between text and the latent representation of speech. It combines the properties of flows and dynamic programming to search for the most probable monotonic alignment, which allows for robust, diverse, and controllable speech synthesis.", "Training and Data": "Glow-TTS is trained to maximize the log-likelihood of the data by combining the properties of flows and dynamic programming to find the most probable monotonic alignment.", "Application": "Suitable for AI voice assistants, audiobook services, advertisements, automotive navigation systems, and automated answering services. Also applicable for real-time speech synthesis tasks.", "Advantages": "Fast Synthesis: Generates mel-spectrograms 15.7 times faster than autoregressive models like Tacotron 2. Robustness: Shows robustness to long texts and outperforms Tacotron 2 in handling long utterances. Diversity and Controllability: Allows for the generation of speech with various intonation patterns and the regulation of pitch and speaking rate.", " Limitations": "Training Complexity: Requires an iterative training process involving alignment search and parameter updates. Data Dependency: Performance depends on the quality and variety of the training dataset. For multi-speaker settings, the model requires a significant amount of training data from different speakers.", "Model Architecture": "Comprises a text encoder, duration predictor, and flow-based decoder. Uses activation normalization, invertible 1x1 convolution, and affine coupling layers. Ensures monotonic alignment using MAS.", "Dependencies": "Python 3, TensorFlow, additional libraries for audio processing", "Synthesis": "Generates mel-spectrograms from text, which are then converted to raw waveforms using the WaveGlow vocoder. Supports real-time applications with an order-of-magnitude speed-up over Tacotron 2.", "Dataset": "LJSpeech (single speaker, 24 hours), LibriTTS (multi-speaker, 54 hours). Data requires trimming silence and filtering text lengths.", "Preprocessing": "Converts text to phonemes, applies silence trimming, and uses WaveGlow vocoder for mel-spectrogram to waveform conversion.", "Evaluation Metrics": "Mean Opinion Score (MOS) for audio quality, Character Error Rate (CER) for robustness, and inference time comparison with Tacotron 2 for synthesis speed.", "Performance": "Comparable MOS to Tacotron 2, robust to long utterances, efficient parallel synthesis.", "Contributions": "Introduced Monotonic Alignment Search (MAS), flow-based architecture for TTS, and made source code and pre-trained models publicly available.", "Link": "https://arxiv.org/abs/2005.11129", "Audio Samples": "https://jaywalnut310.github.io/glow-tts-demo/index.html", "Template": "Glow-TTS Template", "Last Accessed": "2024-07-09", "Checked": "0.0"}, {"Name": "HifiGAN", "Authors": "Jungil Kong, Jaehyeon Kim, Jaekyoung Bae", "Description": "HiFi-GAN is a generative adversarial network for speech synthesis that achieves high-fidelity audio generation with efficient computational performance. It leverages periodic pattern modeling to enhance sample quality and demonstrates significant improvements over previous models like WaveNet and WaveGlow.", "Training and Data": "HiFi-GAN uses a two-stage training process with a generator and two types of discriminators (multi-scale and multi-period). The generator is trained adversarially along with additional losses (mel-spectrogram loss and feature matching loss) to stabilize training and improve audio fidelity.", "Application": "", "Advantages": "HiFi-GAN achieves higher MOS scores than previous models, indicating better audio quality. It synthesizes speech significantly faster than real-time on both GPU and CPU. The model also generalizes well to unseen speakers and performs well in end-to-end TTS pipelines with fine-tuning.", " Limitations": "The model may still require significant computational resources for training, and fine-tuning might be necessary for optimal performance in end-to-end TTS pipelines. The trade-off between model size and synthesis quality needs to be considered for specific applications.", "Model Architecture": "The architecture includes a fully convolutional generator with multi-receptive field fusion modules to capture various patterns. The discriminators consist of multi-period discriminators (MPD) that focus on periodic patterns and multi-scale discriminators (MSD) that capture long-term dependencies.", "Dependencies": "Dependencies include PyTorch for training the convolutional neural networks, tools for audio preprocessing and mel-spectrogram extraction, and computational resources for handling the training and inference processes.", "Synthesis": "Uses GAN-based architecture with discriminators that capture both periodic and long-term dependencies in audio signals. The generator synthesizes raw waveforms from mel-spectrograms, ensuring high fidelity and efficient synthesis through adversarial training and additional loss functions.", "Dataset": "Used datasets include LJSpeech for single-speaker TTS and VCTK for multi-speaker TTS, with specific preprocessing steps for consistency in training and evaluation. These datasets provide diverse audio samples for training and testing the generative models.", "Preprocessing": "Raw audio is preprocessed into mel-spectrograms, which serve as input conditions for the generator. FFT, window, and hop size parameters are set for mel-spectrogram extraction. Preprocessing steps ensure consistency and compatibility with the model's architecture.", "Evaluation Metrics": "Evaluated using MOS tests for perceptual quality, synthesis speed measurements on GPU and CPU, and model size. MOS scores are recorded with 95% confidence intervals, and synthesis speeds are measured in terms of raw audio samples generated per second.", "Performance": "HiFi-GAN achieves superior performance in terms of MOS scores, synthesis speed, and model size compared to previous models. It provides high-fidelity audio generation, efficient synthesis on both GPU and CPU, and demonstrates generalization to unseen speakers and effectiveness in end-to-end TTS pipelines.", "Contributions": "", "Link": "https://arxiv.org/pdf/2010.05646", "Audio Samples": "", "Template": "", "Last Accessed": "2024-07-16", "Checked": "0.0"}, {"Name": "LightSpeech", "Authors": "Renqian Luo, Xu Tan , Rui Wang, Tao Qin , Jinzhu Li, Sheng Zhao, Enhong Chen, Tie-Yan Liu", "Description": "LightSpeech is a lightweight and fast text-to-speech (TTS) model designed using neural architecture search (NAS) to achieve smaller memory usage and lower inference latency, suitable for deployment in resource-constrained devices like mobile phones and embedded systems.", "Training and Data": "LightSpeech uses NAS, specifically GBDT-NAS, to automatically discover efficient architectures within a carefully designed search space. The training involves profiling the existing FastSpeech 2 model to identify bottlenecks and applying NAS to optimize the encoder and decoder architectures.", "Application": "", "Advantages": "LightSpeech achieves a 15x reduction in model size, 16x fewer MACs, and 6.5x faster inference speed on a CPU compared to FastSpeech 2, with comparable audio quality. This makes it highly suitable for deployment in resource-constrained environments without significant loss in performance.", " Limitations": "While LightSpeech is highly efficient, it relies on the availability of NAS infrastructure and the specific design of the search space. The model's performance is dependent on the quality of the search algorithm and the selected proxy metrics during NAS.", "Model Architecture": "The final LightSpeech model consists of an encoder and a decoder, both built using a combination of multi-head self-attention (MHSA) and depthwise separable convolutions (SepConv) with varying kernel sizes. The variance predictors (duration and pitch) also use SepConv for reduced computational complexity.", "Dependencies": "Dependencies include TensorFlow or PyTorch for model training and inference, librosa for audio processing and spectrogram computation, and Parallel WaveGAN for waveform generation. The NAS process relies on GBDT-NAS for architecture search and optimization.", "Synthesis": "Uses non-autoregressive generation to synthesize speech in parallel. The model generates mel-spectrograms from input text, which are then converted into audio waveforms using pre-trained Parallel WaveGAN. The synthesis process benefits from the optimized architecture discovered through NAS for faster and more efficient computation.", "Dataset": "The LJSpeech dataset is used for training and evaluation. It contains 13,100 pairs of text and speech data with approximately 24 hours of speech audio. The dataset is split into training (12,900 samples), dev (100 samples), and test (100 samples) sets. Text is converted to phonemes, and waveforms are transformed into mel-spectrograms.", "Preprocessing": "Preprocessing involves converting text to phonemes using a grapheme-to-phoneme tool and transforming raw waveforms into mel-spectrograms. The frame size is set to 1024 and hop size to 256 with a sample rate of 22050. The model profiles existing FastSpeech 2 components to identify and optimize computational bottlenecks", "Evaluation Metrics": "Evaluated using CMOS for audio quality, model size, MACs for computational complexity, and real-time factor (RTF) for inference speed on a CPU. The evaluation includes comparisons with FastSpeech 2 and a manually designed lightweight FastSpeech 2 model.", "Performance": "LightSpeech achieves a 15x reduction in model size, 16x fewer MACs, and 6.5x faster inference speed on CPU compared to FastSpeech 2, while maintaining comparable audio quality as measured by CMOS evaluations. This demonstrates its suitability for deployment in environments with limited computational resources.", "Contributions": "Introduced a novel lightweight and fast TTS model (LightSpeech) leveraging NAS to optimize architecture for deployment in resource-constrained devices. Demonstrated significant improvements in model efficiency without compromising on audio quality. Provided a comprehensive evaluation of the model's performance.", "Link": "https://arxiv.org/pdf/2102.04040", "Audio Samples": "", "Template": "", "Last Accessed": "2024-07-15", "Checked": "0.0"}, {"Name": "MelGAN", "Authors": "Kundan Kumar, Rithesh Kumar, Thibault de Boissiere, Lucas Gestin, Wei Zhen Teoh, Jose Sotelo, Mila Alexandre de Brebisson, Yoshua Bengio, Aaron Courville", "Description": "MelGAN is a non-autoregressive feed-forward convolutional architecture designed for audio waveform generation in a GAN setup, aimed at generating high-quality coherent waveforms for tasks such as speech synthesis and music domain translation.", "Training and Data": "Trained using a hinge loss version of the GAN objective with a feature matching objective. The generator is a fully convolutional feed-forward network with mel-spectrograms as input and raw waveforms as output. The model is trained with Adam optimizer with a learning rate of 1e-4.", "Application": "Suitable for high-quality text-to-speech synthesis, music domain translation, and unconditional music synthesis.", "Advantages": "Fast and parallelizable, significantly fewer parameters than competing models, generalizes to unseen speakers for mel-spectrogram inversion, and runs at more than 100x faster than real-time on a GTX 1080Ti GPU and more than 2x faster on CPU.", " Limitations": "Slight quality degradation compared to autoregressive models, requires time-aligned conditioning information, and the need for paired ground truth data for feature matching.", "Model Architecture": "The generator consists of transposed convolutional layers with residual blocks and dilated convolutions. The discriminator is a multi-scale architecture with three identical network structures operating on different audio scales, incorporating window-based objectives for feature matching.", "Dependencies": "", "Synthesis": "The system generates raw audio waveforms from mel-spectrograms using a transposed convolutional generator and a multi-scale discriminator that operates on different audio scales.", "Dataset": "Trained on datasets like LJ Speech and an internal 6-speaker dataset containing roughly 10 hours of speech per speaker.", "Preprocessing": "Uses mel-spectrograms as intermediate representations with a resolution of 256x lower than the raw audio waveform.", "Evaluation Metrics": "", "Performance": "Comparable to state-of-the-art high-capacity WaveNet-based models such as WaveNet and WaveGlow in terms of audio quality, with significantly faster inference speeds.", "Contributions": "Introduced a lightweight, non-autoregressive GAN architecture for high-quality audio waveform generation, demonstrating effectiveness and generality in various audio synthesis tasks, and achieving state-of-the-art performance with significantly faster inference times.", "Link": "https://arxiv.org/pdf/1910.06711", "Audio Samples": "https://swpark.me/melgan/", "Template": "", "Last Accessed": "2024-07-10", "Checked": "0.0"}, {"Name": "MelNet", "Authors": "Sean Vasquez, Mike Lewis", "Description": "The paper presents MelNet, a generative model for audio in the frequency domain. MelNet leverages time-frequency representations (spectrograms) instead of time-domain waveforms, using a highly expressive probabilistic model and a multiscale generation procedure to capture both local and global audio structures.", "Training and Data": "The model uses an autoregressive approach, factorizing the joint distribution over a spectrogram as a product of conditional distributions. The network is trained to minimize the negative log-likelihood via gradient descent, with separate training for different audio generation tasks. ", "Application": "", "Advantages": "Captures long-range dependencies more effectively than time-domain models. Generates high-fidelity audio by modeling spectrograms with high temporal and frequency resolution. Applies a multiscale approach to balance capturing global structure and fine-grained details.", " Limitations": "The fidelity of generated audio can be affected by the lossy nature of spectrograms and the chosen spectrogram inversion algorithm. The model's performance may vary across different audio generation tasks and datasets.", "Model Architecture": "The architecture includes a time-delayed stack, frequency-delayed stack, and optionally a centralized stack. The time-delayed stack aggregates information from previous frames, while the frequency-delayed stack processes preceding elements within a frame. The centralized stack operates on entire frames to provide a global context.", "Dependencies": "Dependencies include PyTorch for neural network implementation, librosa for audio processing and spectrogram computation, and Griffin-Lim or gradient-based algorithms for spectrogram inversion.", "Synthesis": "Uses high-resolution spectrograms for modeling. The autoregressive model generates spectrograms in a coarse-to-fine manner, with the initial tier capturing high-level structure and subsequent tiers adding fine-grained details. Spectrograms are converted back to time-domain signals using spectrogram inversion algorithms.", "Dataset": "Four publicly available datasets were used: Blizzard 2013 for single-speaker speech, VoxCeleb2 for multi-speaker speech, MAESTRO for music generation, and TED-LIUM 3 for multi-speaker TTS. Each dataset contains extensive audio recordings with varying characteristics and conditions.", "Preprocessing": "Preprocessing involves converting audio waveforms to high-resolution spectrograms using the short-time Fourier transform (STFT), applying the Mel scale, and logarithmic rescaling of amplitudes. This process aligns the frequency and amplitude axes with human perception of pitch and loudness, respectively.", "Evaluation Metrics": "Evaluated through subjective human judgments on the long-term structure of generated samples, density estimates for TTS tasks, and qualitative analysis of generated audio samples across different tasks.", "Performance": "MelNet generates high-fidelity audio that captures both local characteristics and long-range dependencies, outperforming existing time-domain models like WaveNet in terms of long-term structure and density estimates for TTS tasks. Human evaluations indicate that MelNet-produced samples have more coherent long-term structures.", "Contributions": "Introduced MelNet, a generative model for audio that leverages the advantages of spectrogram representations. Demonstrated its effectiveness in capturing long-range dependencies and generating high-fidelity audio across various tasks. Provided a comprehensive evaluation of the model's performance.", "Link": "https://arxiv.org/pdf/1906.01083", "Audio Samples": "", "Template": "", "Last Accessed": "2024-07-11", "Checked": "0.0"}, {"Name": "Parallel WaveGAN", "Authors": "Ryuichi Yamamoto, Eunwoo Song, Jae-Min Kim", "Description": "Proposes Parallel WaveGAN, a distillation-free, fast, and small-footprint waveform generation method using a GAN. It optimizes multi-resolution spectrogram and adversarial loss functions, capturing the time-frequency distribution of realistic speech waveforms. The model is compact with only 1.44M parameters and generates 24kHz speech 28.68 times faster than real-time on a single GPU.", "Training and Data": "The model is trained using a combination of multi-resolution short-time Fourier transform (STFT) loss and adversarial loss, enabling it to capture time-frequency distributions effectively without the need for a teacher-student framework.", "Application": "", "Advantages": "Distillation-free training process, fast training and inference times, small model size, and high perceptual quality of generated speech.", " Limitations": "The quality of synthesized speech may vary depending on the complexity of the input features and the effectiveness of the multi-resolution STFT loss in capturing speech characteristics.", "Model Architecture": "The model consists of a non-autoregressive WaveNet-based generator with 30 layers of dilated residual convolution blocks and a discriminator with ten layers of non-causal dilated 1-D convolutions.", "Dependencies": "Utilizes a combination of multi-resolution STFT loss and adversarial loss, weight normalization for convolutional layers, and the RAdam optimizer for stabilizing training.", "Synthesis": "Parallel WaveGAN generates high-quality speech by learning the distribution of realistic waveforms through a non-autoregressive WaveNet-based generator and a discriminator network, producing speech faster than real-time.", "Dataset": "A phonetically and prosaically balanced speech corpus recorded by a female professional Japanese speaker, sampled at 24 kHz with 11,449 utterances for training, 250 for validation, and 250 for evaluation.", "Preprocessing": "80-band log-mel spectrograms with a band-limited frequency range (70 to 8000 Hz) were extracted, normalized to have zero mean and unit variance, and used as input auxiliary features for waveform generation.", "Evaluation Metrics": "Mean Opinion Score (MOS) tests for perceptual quality, inference speed (times faster than real-time), and the training time required to achieve optimal models.", "Performance": "Parallel WaveGAN achieved a MOS of 4.16 within a Transformer-based TTS framework, generated 24 kHz speech waveform 28.68 times faster than real-time, and required only 2.8 training days.", "Contributions": "Introduced a joint training method combining multi-resolution STFT loss and adversarial loss for effective waveform generation, demonstrated significant improvements in training and inference speed, and achieved competitive perceptual quality.", "Link": "https://arxiv.org/pdf/1910.11480", "Audio Samples": "", "Template": "", "Last Accessed": "2024-07-18", "Checked": "0.0"}, {"Name": "StarGAN-VC", "Authors": "Hirokazu Kameoka, Takuhiro Kaneko, Kou Tanaka, Nobukatsu Hojo", "Description": "a method that allows non-parallel many-to-many voice conversion (VC) using Star Generative Adversarial Networks (StarGAN).", "Training and Data": "Uses StarGAN with adversarial loss, cycle-consistency loss, domain classification loss, and identity mapping loss for training. The generator takes an acoustic feature sequence and a target attribute label as inputs.", "Application": "", "Advantages": "No need for parallel data, transcriptions, or alignment procedures. Simultaneously learns many-to-many mappings using a single generator. Capable of real-time implementations and requires only a few minutes of training data.", " Limitations": "", "Model Architecture": "The generator consists of encoder and decoder networks using gated CNNs. The discriminator and domain classifier also use gated CNNs to process acoustic feature sequences and generate probability distributions.", "Dependencies": "The method relies on StarGAN architecture, gated CNNs, and the WORLD vocoder for speech analysis and synthesis. Implements using libraries such as PyTorch for neural networks, and optimization with the Adam optimizer.", "Synthesis": "Converts Mel-cepstral coefficients (MCCs), logarithmic fundamental frequency (log F0), and aperiodicities (APs) using the WORLD vocoder. MCCs are learned with StarGAN-VC, log F0 is converted using logarithm Gaussian normalized transformation, and APs are used without modification.", "Dataset": "Voice Conversion Challenge (VCC) 2018 dataset with recordings of US English speakers, manually segmented into training and evaluation sets.", "Preprocessing": "Preprocesses the speech data by downsampling to 22050 Hz, extracting 36 Mel-cepstral coefficients (MCCs), logarithmic fundamental frequency (log F0), and aperiodicities (APs) every 5 ms using the WORLD analysis system. Normalizes the source and target MCCs per dimension before training.", "Evaluation Metrics": "Mean Opinion Score (MOS) for naturalness, AB test for sound quality, and ABX test for speaker similarity.", "Performance": "The StarGAN-VC model is evaluated for naturalness and speaker similarity through subjective listening tests. The method significantly outperformed the VAE-GAN baseline in subjective evaluations for both sound quality and speaker similarity.", "Contributions": "Introduced StarGAN-VC for non-parallel many-to-many voice conversion, demonstrating its effectiveness in achieving high-quality converted speech without requiring parallel data, and providing a general framework applicable to various VC tasks.", "Link": "https://arxiv.org/pdf/1806.02169", "Audio Samples": "", "Template": "", "Last Accessed": "2024-07-10", "Checked": "0.0"}, {"Name": "Tactron 2", "Authors": "Jonathan Shen, Ruoming Pang, Ron J. Weiss, Mike Schuster, Navdeep Jaitly, Zongheng Yang, Zhifeng Chen, Yu Zhang, Yuxuan Wang, RJ Skerry-Ryan, Rif A. Saurous, Yannis Agiomyrgiannakis, and Yonghui Wu", "Description": "Tacotron 2 is a neural network architecture for speech synthesis directly from text. It combines a recurrent sequence-to-sequence feature prediction network with a modified WaveNet vocoder to generate time-domain waveforms from mel-spectrograms.", "Training and Data": "The feature prediction network is trained with a batch size of 64 on a single GPU using the Adam optimizer with a learning rate of 10^-3, decaying to 10^-5. The modified WaveNet is trained with a batch size of 128 across 32 GPUs with synchronous updates and an Adam optimizer learning rate of 10^-4.", "Application": "Suitable for applications requiring high-quality, natural-sounding speech synthesis, such as voice assistants, audiobook generation, and other TTS systems.", "Advantages": "High-quality, natural-sounding speech synthesis comparable to human speech. The system simplifies the traditional TTS pipeline by eliminating the need for hand-engineered features and uses a more compact acoustic representation.", " Limitations": "Occasional mispronunciations and unnatural prosody. Requires extensive training data that covers the intended usage to avoid pronunciation difficulties, especially with out-of-domain text.", "Model Architecture": "The architecture consists of an encoder-decoder with attention for mel-spectrogram prediction and a modified WaveNet vocoder. The encoder has convolutional and bi-directional LSTM layers, and the decoder has uni-directional LSTM layers with a pre-net and a post-net for improved prediction.", "Dependencies": "Lists Python, TensorFlow, and Linux dependencies required for running the models.", "Synthesis": "The system generates mel-spectrograms from text using the feature prediction network and converts these spectrograms to time-domain waveforms using a modified WaveNet vocoder.", "Dataset": "Trained on an internal US English dataset containing 24.6 hours of speech from a single professional female speaker.", "Preprocessing": "Mel-spectrograms are computed from STFT using a 50 ms frame size, 12.5 ms frame hop, and a Hann window function. Log dynamic range compression is applied to the mel-spectrograms.", "Evaluation Metrics": "", "Performance": "The system achieves an MOS of 4.526, comparable to the MOS of 4.582 for professionally recorded speech. It significantly outperforms previous TTS systems.", "Contributions": "Introduced a unified neural approach for TTS, combining sequence-to-sequence prediction with WaveNet vocoder. Achieved state-of-the-art sound quality close to natural human speech.", "Link": "https://arxiv.org/pdf/1712.05884", "Audio Samples": "https://nvidia.github.io/OpenSeq2Seq/html/speech-synthesis/tacotron-2-samples.html", "Template": "", "Last Accessed": "2024-07-10", "Checked": "0.0"}, {"Name": "VAE-VC", "Authors": "Kei Akuzawa, Kotaro Onishi, Keisuke Takiguchi, Kohki Mametani, Koichiro Mori", "Description": "Novel voice conversion (VC) method using a Conditional Deep Hierarchical Variational Autoencoder (CDHVAE) to improve the naturalness and similarity of converted speech without requiring parallel corpora or text transcriptions.", "Training and Data": "Trained on VCTK corpus with utterances from 20 speakers (10 females, 10 males). Mel-spectrograms as acoustic features. MelGAN as vocoder. Batch size: 8. Epochs: 200. Hyperparameter \u03b2 values tested: 1, 10, 50.", "Application": "", "Advantages": "Requires no parallel corpora or text transcriptions, fast conversion speed, and high model expressiveness leading to improved naturalness and similarity in converted speech.", " Limitations": "The performance could be further improved by integrating auxiliary losses and the model may need fine-tuning of hyperparameters for optimal performance in different scenarios.", "Model Architecture": "The model employs a deep hierarchical VAE (DHVAE) with hierarchical latent variables, modified from NVAE architecture by incorporating Conditional Instance Normalization (CIN) for conditioning on speaker labels.", "Dependencies": "Utilizes \u03b2-VAE objective, Conditional Instance Normalization (CIN), and a vocoder (MelGAN) trained on the same corpus for converting mel-spectrograms to audio.", "Synthesis": "Voice conversion is performed by encoding the source speech into speaker-invariant latent variables and decoding it with the target speaker's characteristics using a non-autoregressive decoder.", "Dataset": "VCTK corpus, consisting of utterances from 20 speakers (10 females and 10 males), with mel-spectrograms extracted from 48kHz audio used as acoustic features.", "Preprocessing": "The input mel-spectrograms are resized to fit the model's input dimensions (C = 1, H = 80, W = T = 40) and speaker labels are embedded using linear transformation for CIN.", "Evaluation Metrics": "Mean Opinion Scores (MOS) for naturalness and similarity, rated by human subjects on Amazon Mechanical Turk, along with measurements of KL divergence and reconstruction error", "Performance": "The proposed CDHVAE achieved MOS scores higher than 3.5 for both naturalness and similarity in inter-gender settings, outperforming existing autoencoder-based VC methods.", "Contributions": "Introduced CDHVAE, a high expressiveness VAE model for voice conversion, demonstrated the importance of model expressiveness and the \u03b2-VAE objective, and provided a thorough evaluation of the model's performance.", "Link": "https://arxiv.org/pdf/2112.02796", "Audio Samples": "", "Template": "", "Last Accessed": "2024-07-18", "Checked": "0.0"}, {"Name": "VoCo", "Authors": "Zeyu Jin, Gautham J. Mysore, Stephen DiVerdi, Jingwan Lu, Adam Finkelstein", "Description": "VoCo is a text-based audio editing tool that allows users to replace or insert words in audio narrations seamlessly. The system synthesizes new words by stitching together snippets of audio from elsewhere in the narration, making the edited audio sound natural and consistent.", "Training and Data": "The training process involves aligning the target speaker's speech samples to the transcript using a forced alignment algorithm. This method converts the transcript to phoneme sequences and establishes the mapping between phonemes and speech samples in time.", "Application": "", "Advantages": "Simplifies audio editing by allowing text-based modifications; produces high-quality, natural-sounding edits; reduces the time and effort needed for audio editing, making it accessible to non-experts.", " Limitations": "Optimizing the energy function to better match human perception; extending the method to synthesize longer phrases with natural prosody; incorporating features optimized for seamless audio stitching.", "Model Architecture": "The model architecture includes a TTS synthesizer for generating the initial word and a voice conversion system that uses dynamic triphone preselection, exchangeable triphones, and range selection to convert the TTS-generated word into the target voice.", "Dependencies": "Uses forced alignment for phoneme sequence mapping; utilizes a TTS synthesizer for initial word generation; employs voice conversion techniques such as dynamic triphone preselection, exchangeable triphones, and range selection.", "Synthesis": "The synthesis process uses a TTS synthesizer to generate the new word in a generic voice, then converts it to match the target voice using voice conversion. Range selection and dynamic triphone preselection are used to select optimal audio snippets for smooth transitions.", "Dataset": "CMU Arctic dataset, which includes recordings of multiple voices. The dataset used in the experiments contains recordings segmented by phonemes for both training and synthesis.", "Preprocessing": "Aligning the target speaker's speech samples to the transcript using forced alignment; extracting phoneme sequences and establishing mappings between phonemes and speech samples in time.", "Evaluation Metrics": "Mean Opinion Score (MOS) tests to evaluate the quality of synthesized words; identification tests to measure how often synthesized words are indistinguishable from original recordings; comparison with human synthesis to evaluate the efficiency and effectiveness of VoCo compared to manual editing by audio experts.", "Performance": "VoCo's synthesized words were often rated as more natural than baseline methods; manual editing by experts took significantly longer and resulted in lower quality edits compared to VoCo; users often could not distinguish VoCo's edits from original recordings, especially after manual refinement.", "Contributions": "Introduces a novel method for text-based insertion and replacement in audio narration; improves synthesis quality with exchangeable triphones and dynamic triphone preselection; provides a user-friendly interface for text-based audio editing; demonstrates significant improvements over existing methods in terms of synthesis quality and editing efficiency.", "Link": "https://gfx.cs.princeton.edu/pubs/Jin_2017_VTI/Jin2017-VoCo-paper.pdf", "Audio Samples": "", "Template": "", "Last Accessed": "2024-07-18", "Checked": "0.0"}, {"Name": "WaveGAN", "Authors": "Chris Donahue, Julian McAuley, Miller Puckette", "Description": "WaveGAN is an approach to unsupervised synthesis of raw-waveform audio using GANs, generating one-second audio slices with global coherence, suitable for sound effects.", "Training and Data": "GAN training involves a generator creating audio samples and a discriminator evaluating them against real samples, optimized using WGAN-GP.", "Application": "", "Advantages": "Fully parallelizable audio generation, efficient training and inference, and ability to generate diverse sound effects without supervision.", " Limitations": "Potential artif
